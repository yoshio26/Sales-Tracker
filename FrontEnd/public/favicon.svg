<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9ACB"/>
      <stop offset="0.55" stop-color="#F0408F"/>
      <stop offset="1" stop-color="#B0125E"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFD9EC"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6B0A38" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Soft top gloss -->
  <g clip-path="url(#tile)">
    <ellipse cx="256" cy="40" rx="360" ry="230" fill="url(#gloss)"/>
  </g>

  <!-- Inner gold-pink hairline for a premium edge -->
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Letter P -->
  <path filter="url(#shadow)" fill="url(#letter)" fill-rule="evenodd"
        d="M170 128 H283 C351 128 400 172 400 234 C400 296 351 340 283 340 H238 V392 H170 Z
           M238 188 V280 H278 C308 280 328 262 328 234 C328 206 308 188 278 188 Z"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
